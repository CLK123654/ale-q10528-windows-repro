name: reference-bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare SQLite
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP sqlite-tools.zip
          $runtime = Join-Path $env:RUNNER_TEMP sqlite-tools
          Invoke-WebRequest -Uri https://www.sqlite.org/2023/sqlite-tools-win32-x86-3430200.zip -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne 'fae9efccf4469ca69be5d418fc088593cdb86e07a1b211bdb85463591a923b02') { throw 'SQLite archive hash mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $runtime -Force
          $sqlite = Join-Path $runtime sqlite-tools-win32-x86-3430200\sqlite3.exe
          "SQLITE_BIN=$sqlite" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $sqlite --version
      - name: Generate business output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force output\sql | Out-Null
          Copy-Item candidate\rebuild_privacy_window.sql output\sql\rebuild_privacy_window.sql
          Push-Location input_data
          npm run process
          Pop-Location
          Compress-Archive -Path output -DestinationPath reference.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: reference-bootstrap
          path: |
            reference.zip
            output/
          if-no-files-found: error
          retention-days: 1
